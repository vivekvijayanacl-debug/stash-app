name: Build Offline APK
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Build Cordova APK
        run: |
          npm install -g cordova
          cordova create myapp com.stash.gallery Stash
          rm -rf myapp/www/*
          cp www/index.html myapp/www/index.html
          cd myapp
          cordova platform add android
          cordova build android --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stash-Offline-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/*.apk
