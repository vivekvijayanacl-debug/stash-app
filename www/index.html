<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Stash – Offline Cinema</title>
<style>
:root{--bg:#110b24;--card:#1c123d;--card-hover:#281b54;--pink:#ff4fa3;--lime:#c8ff3d;--gold:#f5c518;--ink:#fff7e8;--mute:#a89bc9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

/* Navbar */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;gap:10px;padding:12px 4%;background:linear-gradient(180deg,rgba(17,11,36,0.98) 0%,rgba(17,11,36,0.85) 100%);backdrop-filter:blur(10px);border-bottom:2px solid rgba(255,79,163,0.3)}
.logo{font:900 26px/1 Impact,sans-serif;letter-spacing:.05em;color:var(--pink);text-shadow:2px 2px 0 var(--lime)}
nav input{margin-left:auto;width:150px;max-width:30vw;padding:8px 14px;border-radius:99px;border:1px solid #ffffff25;background:var(--card);color:var(--ink);font-size:13px}
.b{border:2px solid var(--ink);background:var(--lime);color:#110b24;font-weight:800;border-radius:10px;padding:8px 14px;box-shadow:3px 3px 0 var(--pink);white-space:nowrap;font-size:13px}
label.b{display:inline-block;cursor:pointer}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.b:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--pink)}
.b.ghost{background:transparent;color:var(--ink);box-shadow:none;border-color:#ffffff30}

/* Hero section */
.hero{position:relative;overflow:hidden;margin:14px 4% 0;border-radius:16px;background:var(--card);min-height:260px;display:flex;align-items:flex-end;border:1px solid #ffffff20;box-shadow:0 8px 30px rgba(0,0,0,0.5)}
.hero .bgi{position:absolute;inset:0;background-size:cover;background-position:center top;filter:brightness(.45);transform:scale(1.05)}
.hero .in{position:relative;padding:24px;max-width:650px;z-index:2}
.hero .m-meta{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:12px;font-weight:700}
.hero h1{margin:0 0 8px;font:900 clamp(24px,5vw,44px)/1.05 Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.hero p{margin:0 0 16px;color:#ffffffcc;font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* Rows & Cards */
section{margin-top:24px}
section h2{margin:0 4% 12px;font:800 18px/1 system-ui,sans-serif;letter-spacing:.03em;color:#fffa}
.row{display:flex;gap:14px;overflow-x:auto;padding:4px 4% 18px;scroll-snap-type:x proximity;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.tile{flex:none;width:clamp(125px,17vw,180px);background:none;border:0;padding:0;text-align:left;scroll-snap-align:start;transition:transform .15s ease}
.tile:active{transform:scale(0.96)}
.pos{position:relative;aspect-ratio:2/3;overflow:hidden;border-radius:12px;background:#201445;border:1px solid #ffffff22;box-shadow:0 6px 16px rgba(0,0,0,0.4)}
.pos img{width:100%;height:100%;object-fit:cover;display:block}
.ph{height:100%;display:grid;place-items:center;font:900 48px Impact,sans-serif;color:var(--pink);background:#1a1038}

/* Badges */
.badge-imdb{position:absolute;top:6px;right:6px;background:var(--gold);color:#000;font-weight:900;font-size:11px;padding:2px 6px;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,0.5)}
.stk{position:absolute;top:6px;left:6px;background:var(--pink);color:#fff;font-weight:900;font-size:10px;padding:2px 6px;border-radius:4px}
.prog{position:absolute;left:0;right:0;bottom:0;height:5px;background:#00000088}
.prog u{display:block;height:100%;background:var(--lime)}
.cap{margin-top:8px;font-weight:700;font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--mute);font-size:11px;margin-top:2px}

/* Empty State */
.empty{margin:40px 4%;padding:40px 20px;text-align:center;border:2px dashed #ffffff30;border-radius:20px}
.empty .e{font-size:56px;margin-bottom:12px}
.empty h1{margin:0 0 8px;font:900 28px Impact,sans-serif}
.empty p{color:var(--mute);margin:0 auto 20px;max-width:40ch;font-size:14px}

/* Player modal */
#player{position:fixed;inset:0;z-index:30;background:#060312fa;display:none;align-items:center;justify-content:center;padding:12px;overflow:auto}
#player.open{display:flex}
.pbox{width:min(960px,100%);max-height:100%;background:var(--card);border-radius:16px;border:1px solid #ffffff25;overflow:hidden;display:flex;flex-direction:column}
.screen{position:relative;aspect-ratio:16/9;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.screen video{width:100%;height:100%;object-fit:contain;transform-origin:center center}
.screen video.fit-contain{object-fit:contain}
.screen video.fit-cover{object-fit:cover}
.screen video.fit-fill{object-fit:fill}
.screen video.fit-none{object-fit:none}

#dim-overlay{position:absolute;inset:0;background:#000;pointer-events:none;opacity:0;z-index:3}
#gesture-hud{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);color:#fff;padding:10px 20px;border-radius:24px;font-size:16px;font-weight:800;display:none;align-items:center;gap:8px;z-index:10;pointer-events:none;border:1px solid var(--lime)}
.big{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4;width:66px;height:66px;border-radius:50%;border:1px solid #ffffff60;background:#ffffff26;backdrop-filter:blur(8px);display:grid;place-items:center}
.big::before{content:"";margin-left:4px;border-style:solid;border-width:10px 0 10px 18px;border-color:transparent transparent transparent #fff}
.big.hide{display:none}

/* Controls: Skip between Play */
.ctrl{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#150d30}
.ctrl button{background:none;border:0;font-size:18px;padding:6px;min-width:32px;display:grid;place-items:center}
.ctrl .sk{font-size:12px;font-weight:900;background:#ffffff15;border-radius:8px;padding:4px 8px}
.bar{flex:1;height:6px;border-radius:6px;background:#ffffff26;cursor:pointer;overflow:hidden;margin:0 4px}
.bar div{height:100%;width:0;background:var(--pink)}
.ctrl span{font-size:11px;color:var(--mute);min-width:35px;text-align:center}

.pinfo{padding:16px;overflow:auto}
.pinfo h3{margin:0;font:900 22px/1.2 system-ui,sans-serif}
.pinfo .meta-row{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:12px;color:var(--mute)}
.pinfo p{margin:8px 0 16px;color:#ffffffcc;font-size:13px;line-height:1.4}

/* Fullscreen Behavior */
#player.full{padding:0;background:#000;overflow:hidden}
#player.full .pbox{width:100%;height:100%;max-height:none;border:0;border-radius:0;background:#000}
#player.full .screen{flex:1;aspect-ratio:auto;height:100%}
#player.full .pinfo{display:none}
@media (orientation:portrait){
  #player.full.force-rotate-landscape .pbox{
    position:absolute;top:0;left:0;
    width:100vh;width:100dvh;
    height:100vw;height:100dvw;
    transform-origin:top left;
    transform:translateX(100vw) rotate(90deg);
    transform:translateX(100dvh) rotate(90deg);
  }
}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;background:var(--lime);color:#110b24;font-weight:800;padding:8px 16px;border-radius:10px;display:none;font-size:13px;box-shadow:0 4px 15px rgba(0,0,0,0.5)}
</style>
</head>
<body>

<nav>
  <div class="logo">STASH</div>
  <label class="b" id="add" for="pick" role="button" tabindex="0">+ Add Videos</label>
  <button class="b ghost" id="cfg" title="Settings">⚙</button>
  <input id="q" type="search" placeholder="Search library..." aria-label="Search">
</nav>

<!-- Document & Storage Picker Fallback -->
<input id="pick" class="vh" type="file" accept="video/*,*/*" multiple>

<div id="top"></div>
<main id="rows"></main>

<div id="player" role="dialog" aria-modal="true">
  <div class="pbox" id="pbox" tabindex="-1">
    <div class="screen" id="screen">
      <video id="v" class="fit-contain" playsinline></video>
      <div id="dim-overlay"></div>
      <div id="gesture-hud"></div>
      <button class="big" id="bigpp"></button>
    </div>
    <div class="ctrl">
      <!-- Skip Back, Play/Pause, Skip Forward sequence -->
      <button class="sk" id="bk" aria-label="Back 10s">−10</button>
      <button id="pp" aria-label="Play">▶</button>
      <button class="sk" id="fw" aria-label="Forward 10s">+10</button>
      
      <span id="time">0:00</span>
      <div class="bar" id="bar"><div id="fill"></div></div>
      <span id="dur">0:00</span>
      
      <button id="zm" aria-label="Zoom mode" style="font-size:11px;font-weight:800;border:1px solid #ffffff30;border-radius:6px;padding:3px 6px">Fit</button>
      <button id="fs" aria-label="Full screen">⛶</button>
    </div>
    <div class="pinfo">
      <h3 id="pt"></h3>
      <div class="meta-row" id="pm"></div>
      <p id="pd"></p>
      <button class="b" id="so">↺ Start Over</button>
      <button class="b ghost" id="del">Remove File</button>
      <button class="b ghost" id="close">Close</button>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let lib={},prog={},cur=null,query="",url=null,lastSave=0;
let omdbKey=localStorage.getItem("stash.omdbKey")||"b9bd48a6"; // built-in fallback key

try{
  lib=JSON.parse(localStorage.getItem("stash.lib")||"{}");
  prog=JSON.parse(localStorage.getItem("stash.prog")||"{}");
}catch(e){}

const saveLib=()=>{try{localStorage.setItem("stash.lib",JSON.stringify(lib))}catch(e){}};
const saveProg=()=>{try{localStorage.setItem("stash.prog",JSON.stringify(prog))}catch(e){}};
const keyOf=f=>f.name+"|"+f.size+"|"+f.lastModified;
const fmt=s=>{s=Math.floor(s||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,"0");return h?`${h}:${String(m).padStart(2,"0")}:${x}`:`${m}:${x}`};
const pos=e=>(prog[e.key]&&prog[e.key].p)||0;
const done=e=>e.dur&&pos(e)>e.dur*.92;

let tt;function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(tt);tt=setTimeout(()=>t.style.display="none",3000)}

/* ---- Persistent Storage via IndexedDB ---- */
let db;
function initDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open("stash_media_store",1);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains("videos")){
        d.createObjectStore("videos");
      }
    };
    req.onsuccess=e=>{db=e.target.result;resolve(db)};
    req.onerror=reject;
  });
}
async function saveVideoFile(key,file){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction("videos","readwrite");
    tx.objectStore("videos").put(file,key);
    tx.oncomplete=resolve;
    tx.onerror=reject;
  });
}
async function getVideoFile(key){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction("videos","readonly");
    const req=tx.objectStore("videos").get(key);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=reject;
  });
}
async function deleteVideoFile(key){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction("videos","readwrite");
    tx.objectStore("videos").delete(key);
    tx.oncomplete=resolve;
    tx.onerror=reject;
  });
}

/* ---- Filename Cleaner for Search ---- */
function parseFilename(name){
  let clean=name.replace(/\.[^.]+$/,"");
  const yearMatch=clean.match(/\b(19\d\d|20\d\d)\b/);
  const year=yearMatch?yearMatch[0]:"";
  clean=clean.split(/\b(1080p|720p|4k|2160p|bluray|web-dl|webrip|brrip|hdtv|x264|x265|hevc|aac|yts|rarbg)\b/i)[0];
  clean=clean.replace(/[._\-]/g," ").replace(/\s+/g," ").trim();
  return {cleanTitle:clean||name,year};
}

/* ---- Online Metadata & IMDb Scraping ---- */
async function fetchOnlineMetadata(item){
  if(!omdbKey)return;
  const {cleanTitle,year}=parseFilename(item.rawName);
  try{
    const res=await fetch(`https://www.omdbapi.com/?t=${encodeURIComponent(cleanTitle)}&y=${year}&apikey=${omdbKey}`);
    const data=await res.json();
    if(data.Response==="True"){
      item.title=data.Title;
      item.year=data.Year;
      item.syn=data.Plot!=="N/A"?data.Plot:item.syn;
      item.poster=data.Poster!=="N/A"?data.Poster:item.poster;
      item.imdb=data.imdbRating!=="N/A"?data.imdbRating:null;
      item.genre=data.Genre!=="N/A"?data.Genre:"";
      item.actors=data.Actors!=="N/A"?data.Actors:"";
      saveLib();
      render();
    }
  }catch(e){/* Offline: keep local video frame thumbnail */}
}

/* ---- Poster Generator Fallback ---- */
function extractFrame(file){
  return new Promise(res=>{
    const u=URL.createObjectURL(file),v=document.createElement("video");
    v.muted=true;v.playsInline=true;
    const fin=o=>{clearTimeout(to);URL.revokeObjectURL(u);v.removeAttribute("src");v.load();res(o)};
    const to=setTimeout(()=>fin({dur:0,poster:""}),12000);
    v.onerror=()=>fin({dur:0,poster:""});
    v.onloadedmetadata=()=>{v.currentTime=Math.min(Math.max((v.duration||0)*.15,1),60)};
    v.onseeked=()=>{
      const h=v.videoHeight||300,w=v.videoWidth||400,k=Math.min(1,320/h);
      const c=document.createElement("canvas");c.width=w*k;c.height=h*k;
      let p="";try{c.getContext("2d").drawImage(v,0,0,c.width,c.height);p=c.toDataURL("image/jpeg",.7)}catch(e){}
      fin({dur:v.duration,w,h,poster:p});
    };
    v.src=u;
  });
}

/* ---- File Adding Routine ---- */
async function addFiles(fl){
  const vs=[...fl].filter(f=>/^video\//.test(f.type)||/\.(mp4|m4v|mov|mkv|webm|avi)$/i.test(f.name));
  if(!vs.length){toast("No videos selected.");return}
  toast(`Importing ${vs.length} video${vs.length>1?"s":""}...`);
  for(const f of vs){
    const k=keyOf(f);
    await saveVideoFile(k,f);
    if(!lib[k]){
      const fr=await extractFrame(f);
      const {cleanTitle,year}=parseFilename(f.name);
      lib[k]={
        key:k,
        rawName:f.name,
        title:cleanTitle,
        year:year,
        syn:"",
        dur:fr.dur||0,
        w:fr.w||0,
        h:fr.h||0,
        poster:fr.poster||"",
        added:Date.now()
      };
      saveLib();
      render();
      fetchOnlineMetadata(lib[k]); // Fetch metadata in background
    }
  }
  toast("Saved to offline storage!");
  render();
}

/* ---- Gallery Interface ---- */
function tile(e){
  const p=e.dur?Math.min(100,pos(e)/e.dur*100):0;
  const meta=[e.year,e.dur?fmt(e.dur):""].filter(Boolean).join(" · ");
  return `
    <button class="tile" data-k="${encodeURIComponent(e.key)}">
      <div class="pos">
        ${e.poster?`<img src="${e.poster}" alt="">`:`<div class="ph">${esc((e.title[0]||"?").toUpperCase())}</div>`}
        ${e.imdb?`<span class="badge-imdb">★ ${esc(e.imdb)}</span>`:""}
        ${done(e)?'<b class="stk">SEEN</b>':""}
        ${p>1&&!done(e)?`<i class="prog"><u style="width:${p}%"></u></i>`:""}
      </div>
      <div class="cap">${esc(e.title)}</div>
      <div class="sub">${esc(meta)}</div>
    </button>`;
}

function render(){
  const all=Object.values(lib);
  const q=query.toLowerCase();
  const L=all.filter(e=>e.title.toLowerCase().includes(q));
  const cont=L.filter(e=>pos(e)>5&&!done(e)).sort((a,b)=>(prog[b.key]?.t||0)-(prog[a.key]?.t||0));

  if(!all.length){
    $("top").innerHTML=`<div class="empty"><div class="e">🍿</div><h1>Your Cinema is Empty</h1><p>Add video files once and they remain stored offline permanently. Metadata and posters are fetched automatically.</p><label class="b" for="pick" role="button" tabindex="0">+ Add Videos</label></div>`;
    $("rows").innerHTML="";return;
  }

  const c0=cont[0]||all[0];
  if(c0&&!q){
    $("top").innerHTML=`
      <div class="hero">
        <div class="bgi" style="background-image:url('${c0.poster}')"></div>
        <div class="in">
          <div class="m-meta">
            ${c0.imdb?`<span class="badge-imdb" style="position:static">★ ${esc(c0.imdb)}</span>`:""}
            <span>${esc(c0.year||"")}</span>
            <span>${c0.dur?fmt(c0.dur):""}</span>
            <span>${esc(c0.genre||"")}</span>
          </div>
          <h1>${esc(c0.title)}</h1>
          <p>${esc(c0.syn||"Ready to stream offline.")}</p>
          <button class="b" id="hr" data-k="${encodeURIComponent(c0.key)}">▶ ${pos(c0)>5&&!done(c0)?"Resume":"Play"}</button>
        </div>
      </div>`;
    $("hr").onclick=e=>open(decodeURIComponent(e.currentTarget.dataset.k));
  }else{
    $("top").innerHTML="";
  }

  let h="";
  const row=(t,a)=>{if(a.length)h+=`<section><h2>${t}</h2><div class="row">${a.map(tile).join("")}</div></section>`};
  row("Continue Watching",cont);
  row("Recently Added",[...L].sort((a,b)=>b.added-a.added));
  row("Top Rated Movies",L.filter(e=>e.imdb&&parseFloat(e.imdb)>=7.0).sort((a,b)=>parseFloat(b.imdb)-parseFloat(a.imdb)));
  $("rows").innerHTML=h;
}

/* ---- Video Player ---- */
const v=$("v");
let userBrightness=1.0;
function isPortraitVideo(){return (v.videoHeight||0)>(v.videoWidth||0)}

async function open(k,fresh){
  const e=lib[k];if(!e)return;
  const fileBlob=await getVideoFile(k);
  if(!fileBlob){toast("Error accessing storage.");return}
  cur=e;
  if(url)URL.revokeObjectURL(url);
  url=URL.createObjectURL(fileBlob);
  const start=fresh?0:(pos(e)>5&&!done(e)?pos(e)-3:0);

  v.src=url;
  resetZoom();
  v.onloadedmetadata=()=>{
    if(!e.dur){e.dur=v.duration;saveLib()}
    $("dur").textContent=fmt(v.duration);
    if(start>0)v.currentTime=start;
  };
  $("pt").textContent=e.title;
  $("pm").innerHTML=`${e.imdb?`<span class="badge-imdb" style="position:static">★ ${esc(e.imdb)}</span>`:""} <span>${esc(e.year||"")}</span> <span>${fmt(e.dur)}</span> <span>${esc(e.genre||"")}</span>`;
  $("pd").textContent=e.syn||(e.actors?`Cast: ${e.actors}`:"Offline Video File");
  $("player").classList.add("open");
  $("pbox").focus({preventScroll:true});
  v.play().catch(()=>{});
}

function persist(end){
  if(!cur||!isFinite(v.duration))return;
  prog[cur.key]={p:end?cur.dur||v.duration:v.currentTime,t:Date.now()};
  saveProg();
}
v.ontimeupdate=()=>{
  const d=v.duration||1;
  $("fill").style.width=(v.currentTime/d*100)+"%";
  $("time").textContent=fmt(v.currentTime);
  if(Date.now()-lastSave>2000){lastSave=Date.now();persist()}
};
v.onplay=v.onpause=()=>{
  const p=v.paused;
  $("pp").textContent=p?"▶":"❚❚";
  $("bigpp").classList.toggle("hide",!p);
  if(p)persist();
};
v.onended=()=>persist(true);
const tog=()=>v.paused?v.play().catch(()=>{}):v.pause();
const seek=d=>{v.currentTime=Math.max(0,Math.min(v.duration||0,v.currentTime+d))};
$("pp").onclick=$("bigpp").onclick=tog;
$("bk").onclick=()=>seek(-10);
$("fw").onclick=()=>seek(10);
$("bar").onclick=e=>{const r=$("bar").getBoundingClientRect();v.currentTime=(e.clientX-r.left)/r.width*(v.duration||0)};
$("so").onclick=()=>{v.currentTime=0;v.play().catch(()=>{})};

/* Fullscreen Logic: Portrait Video Fullscreen In Portrait Mode Only */
const isFull=()=>$("player").classList.contains("full");
function setFull(on){
  const isPort=isPortraitVideo();
  $("player").classList.toggle("full",on);
  $("player").classList.toggle("force-rotate-landscape",on && !isPort);
  const d=document,so=screen.orientation;
  try{
    if(on){
      const p=!d.fullscreenElement&&$("player").requestFullscreen?$("player").requestFullscreen():Promise.resolve();
      Promise.resolve(p).then(()=>{
        if(so&&so.lock) so.lock(isPort?"portrait":"landscape").catch(()=>{});
      }).catch(()=>{});
    }else{
      try{so&&so.unlock&&so.unlock()}catch(e){}
      if(d.fullscreenElement&&d.exitFullscreen)d.exitFullscreen().catch(()=>{});
    }
  }catch(e){}
}
function close(){persist();v.pause();setFull(false);$("player").classList.remove("open");v.removeAttribute("src");v.load();cur=null;render()}
$("fs").onclick=()=>setFull(!isFull());
$("close").onclick=close;
$("player").onclick=e=>{if(e.target.id==="player")close()};

$("del").onclick=async()=>{
  if(!cur)return;
  if(confirm(`Remove "${cur.title}" from your library?`)){
    await deleteVideoFile(cur.key);
    delete lib[cur.key];
    delete prog[cur.key];
    saveLib();saveProg();
    close();
  }
};

/* Zoom Options & Gestures */
const ZOOM_MODES=["fit-contain","fit-cover","fit-fill","fit-none"];
const ZOOM_LABELS=["Fit","Crop","Fill","100%"];
let zoomIdx=0,pinchScale=1;
function applyZoomMode(idx){
  zoomIdx=idx%ZOOM_MODES.length;
  v.classList.remove(...ZOOM_MODES);
  v.classList.add(ZOOM_MODES[zoomIdx]);
  $("zm").textContent=ZOOM_LABELS[zoomIdx];
  v.style.transform="";
  pinchScale=1;
}
function resetZoom(){applyZoomMode(0)}
$("zm").onclick=()=>applyZoomMode(zoomIdx+1);

/* Gestures: Volume, Brightness, Seek */
let touchStart={x:0,y:0,time:0,type:null,initVol:1,initBri:1,initSeek:0,dist:0};
let hudTimer=null;
function showHUD(text){
  const h=$("gesture-hud");
  h.textContent=text;h.style.display="flex";
  clearTimeout(hudTimer);
  hudTimer=setTimeout(()=>h.style.display="none",900);
}
const screenEl=$("screen");
screenEl.addEventListener("touchstart",e=>{
  if(e.touches.length===2){
    touchStart.type="pinch";
    touchStart.dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    return;
  }
  if(e.touches.length===1){
    const t=e.touches[0],r=screenEl.getBoundingClientRect();
    touchStart.x=t.clientX;touchStart.y=t.clientY;
    touchStart.time=Date.now();
    touchStart.initVol=v.volume;
    touchStart.initBri=userBrightness;
    touchStart.initSeek=v.currentTime;
    touchStart.type=null;
  }
},{passive:false});

screenEl.addEventListener("touchmove",e=>{
  if(touchStart.type==="pinch"&&e.touches.length===2){
    e.preventDefault();
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    pinchScale=Math.max(0.6,Math.min(3.5,pinchScale*(d/touchStart.dist)));
    v.style.transform=`scale(${pinchScale})`;
    touchStart.dist=d;
    showHUD(`Zoom ${Math.round(pinchScale*100)}%`);
    return;
  }
  if(e.touches.length===1){
    const t=e.touches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y,r=screenEl.getBoundingClientRect();
    if(!touchStart.type){
      if(Math.abs(dx)>20&&Math.abs(dx)>Math.abs(dy)) touchStart.type="seek";
      else if(Math.abs(dy)>20) touchStart.type=(touchStart.x-r.left)<r.width/2?"brightness":"volume";
    }
    if(touchStart.type==="volume"){
      e.preventDefault();
      const nv=Math.max(0,Math.min(1,touchStart.initVol+(-dy/r.height)));
      v.volume=nv;showHUD(`🔊 ${Math.round(nv*100)}%`);
    }else if(touchStart.type==="brightness"){
      e.preventDefault();
      userBrightness=Math.max(0.1,Math.min(1,touchStart.initBri+(-dy/r.height)));
      $("dim-overlay").style.opacity=(1-userBrightness)*0.85;
      showHUD(`☀️ ${Math.round(userBrightness*100)}%`);
    }else if(touchStart.type==="seek"){
      e.preventDefault();
      const s=(dx/r.width)*90;
      const target=Math.max(0,Math.min(v.duration||0,touchStart.initSeek+s));
      v.currentTime=target;
      showHUD(`${s>0?"+":""}${Math.round(s)}s (${fmt(target)})`);
    }
  }
},{passive:false});

screenEl.addEventListener("touchend",e=>{
  if(!touchStart.type&&Date.now()-touchStart.time<250) tog();
  touchStart.type=null;
});

/* Double Tap & Keyboard */
v.ondblclick=()=>setFull(!isFull());
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&isFull())setFull(false)});
document.addEventListener("keydown",e=>{
  if(!$("player").classList.contains("open")||e.target.tagName==="INPUT")return;
  if(e.key==="Escape")isFull()?setFull(false):close();
  if(e.key==="f"||e.key==="F")setFull(!isFull());
  if(e.key===" "){e.preventDefault();tog()}
  if(e.key==="ArrowRight")seek(10);
  if(e.key==="ArrowLeft")seek(-10);
});

/* App Settings */
$("cfg").onclick=()=>{
  const key=prompt("Enter OMDb API Key for IMDb ratings & posters (leave blank to keep current):",omdbKey);
  if(key!==null){
    omdbKey=key.trim();
    localStorage.setItem("stash.omdbKey",omdbKey);
    toast("Saved API key. Refreshing metadata...");
    Object.values(lib).forEach(fetchOnlineMetadata);
  }
};

/* Attach Inputs */
$("pick").onchange=e=>{addFiles(e.target.files);e.target.value=""};
$("q").oninput=e=>{query=e.target.value;render()};
$("rows").onclick=e=>{const t=e.target.closest(".tile");if(t)open(decodeURIComponent(t.dataset.k))};

// Initialize persistent DB & Render
initDB().then(render).catch(render);
</script>
</body>
</html>
